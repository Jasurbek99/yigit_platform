# ── Rate-limit zones (http context — a conf.d file is included inside http{}) ──
# Cheap DoS backstop at the edge: nginx rejects a flood BEFORE it reaches the 3
# Django workers, so a single hammering client can't tie them up (the app-level
# DRF throttle still runs, but only AFTER a worker has already been spent).
# Keyed on $binary_remote_addr = the real client (this nginx faces the LAN
# directly in prod, same address X-Real-IP carries to the app).
#
# Sizing is deliberately generous so NORMAL use never trips it — 30 req/s
# sustained per device is far more than a human generates; burst=60 nodelay
# absorbs the short parallel burst a page makes on load (dashboard fires ~15-20
# API calls at once) by serving them immediately. Only a sustained flood beyond
# that gets 429. Static assets (location /) and WebSocket (/ws/) are NOT limited.
# Tune: raise `rate`/`burst` if a legit heavy page ever trips it (edit + redeploy).
limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=apiconn:10m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cap upload size so no single request can exhaust memory/disk. Document
    # uploads (contract/feedback attachments) are a few MB; 25m leaves headroom.
    client_max_body_size 25m;

    # React SPA — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded files (director signatures, company seals, contract/feedback
    # attachments). WITHOUT this block a request for /media/... falls through to
    # `location /` above, which try_files-es it into index.html — the browser
    # gets 200 text/html for an <img src>, so the upload "succeeds" but nothing
    # ever renders. Served straight off the shared `media_files` volume (mounted
    # read-only here, read-write on backend) rather than proxied to Django:
    # Django's MEDIA url pattern is `static()`, which is a NO-OP when
    # DJANGO_DEBUG=False, so a proxy_pass here would break the day DEBUG is
    # turned off. `alias` (not `root`) + both trailing slashes: with `root` nginx
    # would look for /var/www/media/media/...
    # NOTE: these files are served WITHOUT authentication, same as Django's own
    # debug media serving. Fine on the trusted LAN; revisit (X-Accel-Redirect
    # behind an authenticated view) if the server is ever exposed wider.
    location /media/ {
        alias /var/www/media/;
    }

    # Proxy API calls to Django backend
    location /api/ {
        # Edge rate limit (see zones above). burst=60 nodelay = short bursts are
        # served instantly; only a sustained flood is rejected, as 429 (matches
        # the app's own 429s). limit_conn caps simultaneous connections per IP.
        limit_req    zone=api burst=60 nodelay;
        limit_conn   apiconn 30;
        limit_req_status  429;
        limit_conn_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Document PDF generation shells out to LibreOffice, which render_pdf
        # lets run up to 120s. nginx's DEFAULT proxy_read_timeout is 60s, so a
        # slow conversion was cut off with a 504 Gateway Time-out while the UI
        # spun forever. Keep these above the backend's 120s budget so the real
        # response (or its 503) reaches the client instead of a gateway timeout.
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # WebSocket: same backend, but the upgrade handshake needs the Connection
    # + Upgrade headers forwarded. proxy_read_timeout long so an idle WS isn't
    # killed by nginx between heartbeats.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
